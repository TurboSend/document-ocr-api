name: Build and Deploy

on:
  push:
    branches:
      - main
      - ci
      - dev
      - staging

  pull_request:
    branches:
      - main
      - ci

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: ${{ github.event.repository.name }}
  SERVICE_NAME: ${{ github.event.repository.name }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Determine environment-specific configuration
  # ---------------------------------------------------------------------------
  configure:
    name: Configure Environment
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.config.outputs.environment }}
      aws_key_id_secret: ${{ steps.config.outputs.aws_key_id_secret }}
      aws_secret_key_secret: ${{ steps.config.outputs.aws_secret_key_secret }}
      helm_repo: ${{ steps.config.outputs.helm_repo }}
      helm_repo_org: ${{ steps.config.outputs.helm_repo_org }}
      helm_base_path: ${{ steps.config.outputs.helm_base_path }}
      helm_values_file: ${{ steps.config.outputs.helm_values_file }}
      infra_branch: ${{ steps.config.outputs.infra_branch }}
      image_tag_prefix: ${{ steps.config.outputs.image_tag_prefix }}
      should_deploy: ${{ steps.config.outputs.should_deploy }}

    steps:
      - name: Set environment config
        id: config
        shell: bash
        run: |
          set -euo pipefail

          EVENT="${{ github.event_name }}"

          if [[ "$EVENT" == "pull_request" ]]; then
            BRANCH="${{ github.base_ref }}"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${{ github.ref_name }}"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Resolved branch: $BRANCH"
          echo "Event: $EVENT"

          case "$BRANCH" in
            main|ci)
              {
                echo "environment=production"
                echo "aws_key_id_secret=AWS_ACCESS_KEY_ID_PROD"
                echo "aws_secret_key_secret=AWS_SECRET_ACCESS_KEY_PROD"
                echo "helm_repo=Infra-Optimization"
                echo "helm_repo_org=Payinvert"
                echo "helm_base_path=turbosend-stack"
                echo "helm_values_file=values.yaml"
                echo "infra_branch=main"
                echo "image_tag_prefix="
              } >> "$GITHUB_OUTPUT"
              ;;

            dev)
              {
                echo "environment=dev"
                echo "aws_key_id_secret=AWS_ACCESS_KEY_ID_DEV"
                echo "aws_secret_key_secret=AWS_SECRET_ACCESS_KEY_DEV"
                echo "helm_repo=infra"
                echo "helm_repo_org=Payinvert"
                echo "helm_base_path=helm-charts/turbosend-backend"
                echo "helm_values_file=values.yaml"
                echo "infra_branch=dev-linode"
                echo "image_tag_prefix=dev-linode-"
              } >> "$GITHUB_OUTPUT"
              ;;

            staging)
              {
                echo "environment=staging"
                echo "aws_key_id_secret=AWS_ACCESS_KEY_ID_DEV"
                echo "aws_secret_key_secret=AWS_SECRET_ACCESS_KEY_DEV"
                echo "helm_repo=infra"
                echo "helm_repo_org=Payinvert"
                echo "helm_base_path=helm-charts/document-ocr"
                echo "helm_values_file=values-staging.yaml"
                echo "infra_branch=dev-linode"
                echo "image_tag_prefix=staging-"
              } >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "::error::Unsupported branch: $BRANCH"
              exit 1
              ;;
          esac

      - name: Print config
        run: |
          echo "Environment:    ${{ steps.config.outputs.environment }}"
          echo "Helm repo:      ${{ steps.config.outputs.helm_repo_org }}/${{ steps.config.outputs.helm_repo }}"
          echo "Helm base path: ${{ steps.config.outputs.helm_base_path }}"
          echo "Values file:    ${{ steps.config.outputs.helm_values_file }}"
          echo "Infra branch:   ${{ steps.config.outputs.infra_branch }}"
          echo "Should deploy:  ${{ steps.config.outputs.should_deploy }}"

  # ---------------------------------------------------------------------------
  # 2. Build Docker image and push to ECR
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and Push to ECR
    needs: configure
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-uri: ${{ steps.image-info.outputs.image-uri }}
      image-digest: ${{ steps.build-image.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests only validate that the image builds.
      - name: Build Docker image for pull request
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.pull_request.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=pr-${{ github.event.pull_request.number }}-${{ github.sha }}

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets[needs.configure.outputs.aws_key_id_secret] }}
          aws-secret-access-key: ${{ secrets[needs.configure.outputs.aws_secret_key_secret] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        if: github.event_name == 'push'
        uses: int128/create-ecr-repository-action@v1
        with:
          repository: ${{ env.ECR_REPOSITORY }}
          public: false

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract Docker metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=raw,value=${{ needs.configure.outputs.image_tag_prefix }}${{ github.run_number }}-${{ github.sha }}
            type=raw,value=${{ needs.configure.outputs.image_tag_prefix }}${{ github.run_number }}
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Set image information
        if: github.event_name == 'push'
        id: image-info
        shell: bash
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"

          echo "image-uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Image pushed: $IMAGE_URI:${{ steps.meta.outputs.version }}"
          echo "Digest: ${{ steps.build-image.outputs.digest }}"

  # ---------------------------------------------------------------------------
  # 3. Update Helm chart in infrastructure repo
  # ---------------------------------------------------------------------------
  update-helm-chart:
    name: Update Helm Chart (${{ needs.configure.outputs.environment }})
    needs:
      - configure
      - build-and-push

    runs-on: ubuntu-latest

    if: |
      github.event_name == 'push' &&
      needs.configure.outputs.should_deploy == 'true'

    permissions:
      contents: read

    concurrency:
      group: helm-update-${{ needs.configure.outputs.helm_repo }}-${{ needs.configure.outputs.infra_branch }}
      cancel-in-progress: false

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.configure.outputs.helm_repo_org }}/${{ needs.configure.outputs.helm_repo }}
          token: ${{ secrets.REPO_TOKEN }}
          path: infrastructure
          ref: ${{ needs.configure.outputs.infra_branch }}
          fetch-depth: 0

      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail

          YQ_VERSION="v4.44.3"

          sudo wget \
            -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"

          sudo chmod +x /usr/local/bin/yq

          yq --version

      - name: Update Helm values file
        shell: bash
        env:
          HELM_BASE_PATH: ${{ needs.configure.outputs.helm_base_path }}
          VALUES_FILE_NAME: ${{ needs.configure.outputs.helm_values_file }}
          IMAGE_URI: ${{ needs.build-and-push.outputs.image-uri }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          set -euo pipefail

          CHART_PATH="infrastructure/${HELM_BASE_PATH}/${SERVICE_NAME}"
          VALUES_FILE="${CHART_PATH}/${VALUES_FILE_NAME}"

          if [[ ! -d "$CHART_PATH" ]]; then
            echo "::error::Chart path not found: $CHART_PATH"
            exit 1
          fi

          if [[ ! -f "$VALUES_FILE" ]]; then
            echo "::error::Values file not found: $VALUES_FILE"
            exit 1
          fi

          echo "Updating $VALUES_FILE"
          echo "Image repository: $IMAGE_URI"
          echo "Image tag: $IMAGE_TAG"

          yq eval '.image.repository = strenv(IMAGE_URI)' -i "$VALUES_FILE"
          yq eval '.image.tag = strenv(IMAGE_TAG)' -i "$VALUES_FILE"

          echo "Updated image configuration:"
          yq eval '.image' "$VALUES_FILE"

      - name: Commit and push changes
        shell: bash
        env:
          INFRA_BRANCH: ${{ needs.configure.outputs.infra_branch }}
          HELM_BASE_PATH: ${{ needs.configure.outputs.helm_base_path }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
          DEPLOY_ENVIRONMENT: ${{ needs.configure.outputs.environment }}
        run: |
          set -euo pipefail

          cd infrastructure

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${HELM_BASE_PATH}/${SERVICE_NAME}/"

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit \
            -m "chore(${SERVICE_NAME}): deploy ${IMAGE_TAG}" \
            -m "Environment: ${DEPLOY_ENVIRONMENT}
          Triggered by: ${{ github.actor }}
          Source commit: ${{ github.sha }}"

          # Handle a possible infrastructure branch update before pushing.
          git pull --rebase origin "$INFRA_BRANCH"
          git push origin "HEAD:$INFRA_BRANCH"

          echo "Changes pushed successfully"

      - name: Deployment summary
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image-uri }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          {
            echo "## Deployment Summary"
            echo
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Service** | ${{ env.SERVICE_NAME }} |"
            echo "| **Environment** | ${{ needs.configure.outputs.environment }} |"
            echo "| **Image** | \`${IMAGE_URI}:${IMAGE_TAG}\` |"
            echo "| **Infra repository** | ${{ needs.configure.outputs.helm_repo_org }}/${{ needs.configure.outputs.helm_repo }} |"
            echo "| **Infra branch** | ${{ needs.configure.outputs.infra_branch }} |"
            echo "| **Values file** | ${{ needs.configure.outputs.helm_values_file }} |"
            echo "| **Source commit** | \`${{ github.sha }}\` |"
            echo "| **Triggered by** | ${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"
